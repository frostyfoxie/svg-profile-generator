name: SVG Profile Generator

description: Generate and commit an animated GitHub profile SVG automatically.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/profile.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate SVG profile
        uses: frostyfoxie/svg-profile-generator@v1
