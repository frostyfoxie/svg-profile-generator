name: SVG Profile Generator
description: Generate a polished animated GitHub profile SVG from your GitHub data with almost no setup

branding:
  icon: user
  color: purple

inputs:
  github-token:
    description: Base GitHub token used for the workflow. Public GitHub data is used by default.
    required: false
    default: ''
  pat-token:
    description: Optional PAT_TOKEN for additional private repository statistics. Leave empty for public-only repository stats.
    required: false
    default: ''
  username:
    description: GitHub username to generate the profile for
    required: false
    default: ''
  config-path:
    description: Public profile configuration file; created automatically on first run
    required: false
    default: .github/profile.json
  output-directory:
    description: Directory where generated SVG files are written
    required: false
    default: .
  source-ref:
    description: Pinned source revision of the profile generator
    required: false
    default: 51221d298a8f6f79e91165e06e8a997428dac139
  commit:
    description: Commit generated SVGs and a newly created profile config automatically
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Generate animated SVG profile
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_USERNAME: ${{ inputs.username || github.repository_owner }}
        INPUT_PAT_TOKEN: ${{ inputs.pat-token }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_SOURCE_REF: ${{ inputs.source-ref }}
      run: python "${{ github.action_path }}/scripts/run_generator.py"

    - name: Commit generated profile and first-run config
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      env:
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$INPUT_OUTPUT_DIRECTORY/profile.svg" "$INPUT_OUTPUT_DIRECTORY/btn_github.svg" "$INPUT_OUTPUT_DIRECTORY/btn_instagram.svg" "$INPUT_OUTPUT_DIRECTORY/btn_email.svg" "$INPUT_CONFIG_PATH"
        if git diff --cached --quiet; then
          echo "Profile is already up to date."
        else
          git commit -m "chore: update SVG profile"
          git push
        fi
